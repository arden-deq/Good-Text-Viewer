server {
    listen 80;
    listen [::]:80;
    server_name goodtextviewer.allmightdev.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/goodtextviewer/acme;
    }

    location / {
        return 301 https://goodtextviewer.allmightdev.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name goodtextviewer.allmightdev.com;

    ssl_certificate /etc/letsencrypt/live/goodtextviewer.allmightdev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goodtextviewer.allmightdev.com/privkey.pem;

    root /var/www/goodtextviewer/site/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
