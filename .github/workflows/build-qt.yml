name: Build Qt viewer

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and backfill on Windows (optional)
        required: false
        type: string

permissions:
  contents: read

jobs:
  macos:
    if: github.event_name != 'release' && !inputs.release_tag
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install aqtinstall==3.3.0
      - run: aqt install-qt mac desktop 6.8.3 clang_64 --archives qtbase qttools -O "$RUNNER_TEMP/Qt"
      - run: |
          export CMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/6.8.3/macos"
          make test
          make release
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-universal-local-preview
          path: |
            dist/*-macOS-universal.zip
            dist/*-macOS-universal.zip.sha256

  windows:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Validate the release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Expected a stable vMAJOR.MINOR.PATCH release tag"
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install aqtinstall==3.3.0
      - name: Install Qt and its matching MinGW toolkit
        shell: pwsh
        run: |
          aqt install-qt windows desktop 6.8.3 win64_mingw --archives qtbase qttools -O "$env:RUNNER_TEMP/Qt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 -O "$env:RUNNER_TEMP/Qt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP/Qt/Tools/mingw1310_64/bin" >> $env:GITHUB_PATH
          "$env:RUNNER_TEMP/Qt/6.8.3/mingw_64/bin" >> $env:GITHUB_PATH
      - name: Build, test and package on Windows
        shell: pwsh
        run: |
          $env:CMAKE_PREFIX_PATH = "$env:RUNNER_TEMP/Qt/6.8.3/mingw_64"
          try {
            ./Scripts/package-windows.ps1 -PortableExe
          } catch {
            $test = ".build/qt-windows-native/reader_tests.exe"
            if (Test-Path $test) {
              $env:QT_QPA_PLATFORM = "offscreen"
              $process = Start-Process -FilePath $test -ArgumentList "-o reader-diagnostic.txt,txt" -NoNewWindow -Wait -PassThru
              Write-Output ("Test process exit code: 0x{0:X8}" -f $process.ExitCode)
              if (Test-Path reader-diagnostic.txt) { Get-Content reader-diagnostic.txt }
            }
            throw
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-portable
          path: |
            dist/*-Windows-x64.zip
            dist/*-Windows-x64.zip.sha256
            dist/*-Windows-x64.exe
            dist/*-Windows-x64.exe.sha256

  publish-windows:
    if: github.event_name == 'release' || inputs.release_tag
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: windows-release-${{ github.event.release.tag_name || inputs.release_tag }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Windows-x64-portable
      - name: Attach the tested Windows package to the matching release
        shell: bash
        run: |
          set -euo pipefail
          package="Good-Text-Viewer-${RELEASE_TAG#v}-Windows-x64"
          sha256sum --check "$package.zip.sha256" "$package.exe.sha256"
          existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          files=()
          for file in "$package.exe" "$package.exe.sha256" "$package.zip" "$package.zip.sha256"; do
            if ! grep -Fxq "$file" <<< "$existing"; then
              files+=("$file")
            fi
          done
          if (( ${#files[@]} )); then
            gh release upload "$RELEASE_TAG" "${files[@]}"
          fi
